version: "3.8"

services:
  postgres:
    image: postgres:15
    container_name: vulnapp-db
    restart: always
    environment:
      POSTGRES_DB: vulnappdb
      POSTGRES_USER: vulnuser
      POSTGRES_PASSWORD: vulnpass
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vulnuser -d vulnappdb"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vulnapp-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/vulnappdb
      SPRING_DATASOURCE_USERNAME: vulnuser
      SPRING_DATASOURCE_PASSWORD: vulnpass
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_SHOW_SQL: "true"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend/vue-project
      dockerfile: Dockerfile.frontend
      args:
        VUE_APP_API_URL: "http://backend:8080"
    container_name: vulnapp-frontend
    depends_on:
      - backend
    ports:
      - "5173:80"
    restart: unless-stopped

  adminer:
    image: adminer:latest
    container_name: vulnapp-adminer
    restart: always
    ports:
      - "8081:8080"

volumes:
  pgdata:
